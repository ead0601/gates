<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Graph View (FF-centered)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<meta charset="utf-8" />
<title>VNLT GUI — FF-centered layout</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root {
    --bg:#0e1116;--panel:#151922;--text:#e8eef9;--muted:#94a3b8;
    --edge:#91a4c2;--io:#22c55e;--ff:#f59e0b;--comb:#38bdf8;--sel:#f43f5e;--dim:.12;
    --solo-dim:.05; --bridge-alpha:.55;
  }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.35 Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  #topbar{display:flex;gap:.5rem;align-items:center;padding:.5rem .75rem;background:var(--panel);border-bottom:1px solid #1f2430;position:sticky;top:0;z-index:2}
  #topbar input[type="text"]{width:22rem;padding:.35rem .5rem;background:#0b0e13;color:var(--text);border:1px solid #202635;border-radius:.25rem}
  #topbar button,#topbar label{background:#0b0e13;color:var(--text);border:1px solid #202635;padding:.35rem .6rem;border-radius:.35rem;cursor:pointer}
  #topbar button:hover{border-color:#334155}
  #wrap{display:grid;grid-template-columns:1fr 360px;height:calc(100% - 42px)}
  #stage{position:relative;background:#0b0e13;overflow:hidden}
  #sidebar{border-left:1px solid #1f2430;background:var(--panel);padding:.75rem;overflow:auto}
  #stats{color:var(--muted);margin-left:auto}
  .legend{display:flex;gap:.5rem;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .45rem;background:#0b0e13;border:1px solid #202635;border-radius:.35rem}
  .dot{width:.7rem;height:.7rem;border-radius:999px;display:inline-block}
  .io-dot{background:var(--io)}.ff-dot{background:var(--ff)}.comb-dot{background:var(--comb)}
  svg{width:100%;height:100%;touch-action:none}
  .node rect,.node path.round{stroke:#1f2937;fill:#0f1720}
  .node.io rect{stroke:var(--io);fill:rgba(34,197,94,.12)}
  .node.ff path.round{stroke:var(--ff);fill:rgba(245,158,11,.12)}
  .node.comb rect{stroke:var(--comb);fill:rgba(56,189,248,.12)}
  .node .label{fill:var(--text);font-size:11px;pointer-events:none}
  .edge-path{stroke:var(--edge);stroke-width:1.4;fill:none;opacity:.9; marker-end:url(#arrow)}
  .edge-hit{stroke:transparent;stroke-width:10;fill:none;cursor:pointer}
  .edge-bridge{stroke-dasharray:6 6; opacity:var(--bridge-alpha)}
  .dim{opacity:var(--dim)}
  .solo-dim{opacity:var(--solo-dim)}
  .selected rect,.selected path.round{stroke:var(--sel)}
  .warn{color:#f59e0b}
  .row{display:flex;gap:.5rem;flex-wrap:wrap;margin:.25rem 0}
  .row small{color:var(--muted)}
  .badge{font-size:10px;fill:#0b0e13;stroke:#475569;stroke-width:1;paint-order:stroke;dominant-baseline:middle}
  .badge-src{fill:#22c55e}.badge-dst{fill:#f43f5e}
</style>

</head>
<body>

<div id="topbar">
  <div class="legend">
    <span class="chip"><span class="dot io-dot"></span> IO</span>
    <span class="chip"><span class="dot ff-dot"></span> FF</span>
    <span class="chip"><span class="dot comb-dot"></span> Comb</span>
  </div>
  <input id="search" type="text" placeholder="Search node id/label…" />
  <button id="btnClear">Clear</button>
  <button id="btnFit">Fit</button>
  <label><input type="checkbox" id="chkFFCentered" checked /> FF-centered</label>
  <label title="Fan-in recursion will NOT stop at IO when ON"><input type="checkbox" id="chkFanInAcrossIO" /> Fan-in across IO</label>
  <label title="Allow cones to cross flip-flops"><input type="checkbox" id="chkCrossFF" /> Cross-FF</label>
  <span id="stats"></span>
</div>

<div id="wrap">
  <div id="stage">
    <svg id="svg" viewBox="0 0 2000 1200" preserveAspectRatio="xMidYMid meet">
      <defs>
        <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto">
          <path d="M0,0 L10,3.5 L0,7 z" fill="currentColor" stroke="none"></path>
        </marker>
      </defs>
      <g id="grid"></g>
      <g id="edges"></g>
      <g id="nodes"></g>
      <g id="badges"></g>
    </svg>
  </div>
  <aside id="sidebar">
    <h3 style="margin:.25rem 0 .5rem;">Selection</h3>
    <div id="sel">None</div>
    <hr style="border:0;border-top:1px solid #232938;margin:.75rem 0;">
    <h3 style="margin:.25rem 0 .5rem;">Actions</h3>
    <div class="row">
      <button id="btnFanIn"  title="X">Fan-in (X)</button>
      <button id="btnFanOut" title="F">Fan-out (F)</button>
      <button id="btnClearHL" title="C">Clear (C)</button>
    </div>
    <div class="row">
      <button id="btnColorNet"  title="N">Color net (N)</button>
      <button id="btnResetColors" title="R">Reset colors (R)</button>
      <button id="btnSoloNet"   title="S">Solo net (S)</button>
      <label title="When ON, recursively include all nets reachable through IOBUFs (dashed)"><input type="checkbox" id="chkFollowIOBUF" checked /> Follow across IOBUF</label>
    </div>
    <hr style="border:0;border-top:1px solid #232938;margin:.75rem 0;">
    <h3 style="margin:.25rem 0 .5rem;">Info</h3>
    <div id="info"></div>
  </aside>
</div>




<!-- Stable module order -->
<script defer src="../js/ports.order.js"></script>
<script defer src="../js/app.core.js"></script>


M: inline loader to set window.VNLT_GRAPH from volatile/graph.json -->

</body>
</html>
